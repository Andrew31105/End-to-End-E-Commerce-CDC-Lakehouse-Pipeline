<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .grid-pattern { stroke: #e2e8f0; stroke-width: 1; }
      .class-header { fill: #2563eb; }
      .class-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; font-size: 15px; }
      .class-body { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .attr-text { fill: #1e293b; font-family: "JetBrains Mono", "Fira Code", monospace, sans-serif; font-size: 13px; }
      .type-text { fill: #64748b; }
      .arrow { stroke: #0f172a; stroke-width: 2; fill: none; }
      .arrow-head { fill: #0f172a; }
      .cardinality { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .shadow { filter: drop-shadow(0 4px 6px -1px rgb(0 0 0 / 0.1)); }
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" class="grid-pattern" />
    </pattern>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- ================= CATEGORY ================= -->
  <g class="shadow" transform="translate(60, 60)">
    <rect width="240" height="120" rx="6" class="class-body" />
    <path d="M 0 6 Q 0 0 6 0 L 234 0 Q 240 0 240 6 L 240 36 L 0 36 Z" class="class-header" />
    <text x="120" y="24" text-anchor="middle" class="class-title">Category</text>
    <text x="16" y="60" class="attr-text">+ id <tspan class="type-text">: int (PK)</tspan></text>
    <text x="16" y="84" class="attr-text">+ name <tspan class="type-text">: string</tspan></text>
    <text x="16" y="108" class="attr-text">+ description <tspan class="type-text">: string</tspan></text>
  </g>

  <!-- ================= PRODUCT ================= -->
  <g class="shadow" transform="translate(380, 60)">
    <rect width="250" height="190" rx="6" class="class-body" />
    <path d="M 0 6 Q 0 0 6 0 L 244 0 Q 250 0 250 6 L 250 36 L 0 36 Z" class="class-header" />
    <text x="125" y="24" text-anchor="middle" class="class-title">Product</text>
    <text x="16" y="60" class="attr-text">+ id <tspan class="type-text">: int (PK)</tspan></text>
    <text x="16" y="84" class="attr-text">+ category_id <tspan class="type-text">: int (FK)</tspan></text>
    <text x="16" y="108" class="attr-text">+ name <tspan class="type-text">: string</tspan></text>
    <text x="16" y="132" class="attr-text">+ base_price <tspan class="type-text">: decimal</tspan></text>
    <text x="16" y="156" class="attr-text">+ stock <tspan class="type-text">: int</tspan></text>
    <text x="16" y="180" class="attr-text">+ is_active <tspan class="type-text">: boolean</tspan></text>
  </g>

  <!-- ================= USER ================= -->
  <g class="shadow" transform="translate(710, 60)">
    <rect width="230" height="165" rx="6" class="class-body" />
    <path d="M 0 6 Q 0 0 6 0 L 224 0 Q 230 0 230 6 L 230 36 L 0 36 Z" class="class-header" />
    <text x="115" y="24" text-anchor="middle" class="class-title">User</text>
    <text x="16" y="60" class="attr-text">+ id <tspan class="type-text">: int (PK)</tspan></text>
    <text x="16" y="84" class="attr-text">+ full_name <tspan class="type-text">: string</tspan></text>
    <text x="16" y="108" class="attr-text">+ email <tspan class="type-text">: string</tspan></text>
    <text x="16" y="132" class="attr-text">+ phone <tspan class="type-text">: string</tspan></text>
    <text x="16" y="156" class="attr-text">+ city <tspan class="type-text">: string</tspan></text>
  </g>

  <!-- ================= ORDER ================= -->
  <g class="shadow" transform="translate(340, 360)">
    <rect width="330" height="260" rx="6" class="class-body" />
    <path d="M 0 6 Q 0 0 6 0 L 324 0 Q 330 0 330 6 L 330 36 L 0 36 Z" class="class-header" />
    <text x="165" y="24" text-anchor="middle" class="class-title">Order</text>
    <text x="16" y="60" class="attr-text">+ id <tspan class="type-text">: int (PK)</tspan></text>
    <text x="16" y="84" class="attr-text">+ user_id <tspan class="type-text">: int (FK)</tspan></text>
    <text x="16" y="108" class="attr-text">+ product_id <tspan class="type-text">: int (FK)</tspan></text>
    <text x="16" y="132" class="attr-text">+ quantity <tspan class="type-text">: int</tspan></text>
    <text x="16" y="156" class="attr-text">+ unit_price <tspan class="type-text">: decimal</tspan></text>
    <text x="16" y="180" class="attr-text">+ total_amount <tspan class="type-text">: decimal</tspan></text>
    <text x="16" y="204" class="attr-text">+ status <tspan class="type-text">: string</tspan></text>
    <text x="16" y="228" class="attr-text">+ ordered_at <tspan class="type-text">: timestamp</tspan></text>
    <text x="16" y="252" class="attr-text">+ updated_at <tspan class="type-text">: timestamp</tspan></text>
  </g>

  <!-- ================= RELATIONSHIPS ================= -->

  <!-- Product -> Category (N:1) -->
  <path d="M 380 120 L 310 120" class="arrow" marker-end="url(#arrowhead)" />
  <text x="360" y="112" class="cardinality">*</text>
  <text x="315" y="112" class="cardinality">1</text>

  <!-- Order -> Product (N:1) -->
  <path d="M 460 360 L 460 260" class="arrow" marker-end="url(#arrowhead)" />
  <text x="445" y="340" class="cardinality">*</text>
  <text x="445" y="275" class="cardinality">1</text>

  <!-- Order -> User (N:1) -->
  <path d="M 570 360 L 570 300 L 825 300 L 825 235" class="arrow" marker-end="url(#arrowhead)" />
  <text x="555" y="340" class="cardinality">*</text>
  <text x="835" y="255" class="cardinality">1</text>

</svg>
