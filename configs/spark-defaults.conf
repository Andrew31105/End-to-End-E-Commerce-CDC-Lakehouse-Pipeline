# ============================================================
# Spark Configuration – Iceberg + Hive Metastore + MinIO (S3-compatible)
# ============================================================

# ---- Iceberg Catalog (Hive Metastore) ----
spark.sql.extensions                     org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalogImplementation          hive
spark.sql.catalog.iceberg                org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type           hive
spark.sql.catalog.iceberg.uri            thrift://hive-metastore:9083
spark.sql.catalog.iceberg.warehouse      s3a://iceberg-datawarehouse/
spark.sql.warehouse.dir                 s3a://iceberg-datawarehouse/
spark.hadoop.hive.metastore.uris        thrift://hive-metastore:9083

# ---- MinIO S3 Configuration (credentials lấy từ env AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) ----
spark.hadoop.fs.s3a.endpoint             http://minio:9000
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.path.style.access    true
spark.hadoop.fs.s3a.impl                 org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false

# ---- Iceberg Settings ----
spark.sql.defaultCatalog                 iceberg
spark.sql.catalog.iceberg.cache-enabled  true
# TẮT vectorized reader: Iceberg 1.5.0 + Spark 3.5 crash JVM (NPE ở
# PartitionIterator.hasNext khi chuyển columnar → row) trên bảng Bronze có
# cột STRUCT và nhiều dòng NULL. Đọc dạng row ổn định hơn, đánh đổi tốc độ.
spark.sql.iceberg.vectorization.enabled  false
spark.sql.catalog.iceberg.format-version 2

# ---- Performance ----
# 32 partition: dữ liệu lịch sử trải ~730 ngày nên cần đủ task để mỗi task chỉ
# ghi vài chục partition Iceberg (tránh fanout mở hàng trăm Parquet writer).
spark.sql.shuffle.partitions             32
spark.sql.adaptive.enabled               true
spark.sql.adaptive.coalescePartitions.enabled true
