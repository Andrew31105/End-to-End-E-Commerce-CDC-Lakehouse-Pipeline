# ============================================================
# Spark Configuration – Iceberg + MinIO (S3-compatible)
# ============================================================

# ---- Iceberg Catalog (Hadoop) ----
spark.sql.extensions                     org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg                org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type           hadoop
spark.sql.catalog.iceberg.warehouse      s3a://iceberg-datawarehouse
spark.sql.catalog.iceberg.io-impl        org.apache.iceberg.hadoop.HadoopFileIO

# ---- MinIO S3 Configuration (credentials lấy từ env AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) ----
spark.hadoop.fs.s3a.endpoint             http://minio:9000
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.path.style.access    true
spark.hadoop.fs.s3a.impl                 org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false

# ---- Iceberg Settings ----
spark.sql.defaultCatalog                 iceberg
spark.sql.catalog.iceberg.cache-enabled  true
spark.sql.iceberg.vectorization.enabled  true
spark.sql.catalog.iceberg.format-version 2

# ---- Performance ----
spark.sql.shuffle.partitions             8
spark.sql.adaptive.enabled               true
spark.sql.adaptive.coalescePartitions.enabled true
