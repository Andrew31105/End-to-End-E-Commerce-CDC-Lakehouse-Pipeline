# ============================================================
# Trino Iceberg Catalog – Kết nối Iceberg tables trên MinIO (S3)
# ============================================================
connector.name=iceberg
iceberg.catalog.type=hadoop
iceberg.catalog.warehouse=s3a://iceberg-datawarehouse
hive.metastore.uri=

# MinIO S3 configuration (credentials lấy từ env của container Trino)
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}

# Iceberg format version
iceberg.format-version=2
