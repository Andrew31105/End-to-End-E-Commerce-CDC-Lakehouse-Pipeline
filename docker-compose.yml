services:
  # ============================================================
  #  Zookeeper – quản lý cluster cho Kafka
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 10s
      retries: 5

  # ============================================================
  #  Kafka Broker
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 15s
      retries: 5

  # ============================================================
  #  PostgreSQL – Transactional Database (Source)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=5"
      - "-c"
      - "max_replication_slots=5"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      retries: 5

  # ============================================================
  #  Debezium Kafka Connect – CDC Engine
  # ============================================================
  connect:
    image: debezium/connect:2.6
    container_name: debezium-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
    ports:
      - "8083:8083"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/connectors" ]
      interval: 15s
      retries: 5

  # ============================================================
  #  MinIO – Object Storage (S3-compatible) – Data Lake Bronze Zone
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      retries: 5

  # ============================================================
  #  MinIO Client – tự động tạo bucket khi khởi động
  # ============================================================
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " set -e; mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; mc mb --ignore-existing local/iceberg-datalake; mc mb --ignore-existing local/iceberg-datawarehouse; echo 'MinIO buckets created successfully'; exit 0; "

  # ============================================================
  #  Hive Metastore DB – PostgreSQL backend cho HMS
  # ============================================================
  hive-metastore-db:
    image: postgres:15-alpine
    container_name: hive-metastore-db
    environment:
      POSTGRES_DB: ${HIVE_METASTORE_DB:-metastore}
      POSTGRES_USER: ${HIVE_METASTORE_DB_USER:-hive}
      POSTGRES_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:-hive123}
    volumes:
      - hive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${HIVE_METASTORE_DB_USER:-hive} -d ${HIVE_METASTORE_DB:-metastore}" ]
      interval: 10s
      retries: 5

  # ============================================================
  #  Hive Metastore – Standalone Thrift Metastore 3.1.2 (Iceberg Catalog)
  # ============================================================
  hive-metastore:
    image: bitsondatadev/hive-metastore:latest
    container_name: hive-metastore
    environment:
      METASTORE_DB_HOSTNAME: hive-metastore-db
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
        set -e;
        export HADOOP_HOME=/opt/hadoop-3.2.0;
        export JAVA_HOME=/usr/local/openjdk-8;
        export HADOOP_CLASSPATH=$${HADOOP_HOME}/share/hadoop/tools/lib/aws-java-sdk-bundle-1.11.375.jar:$${HADOOP_HOME}/share/hadoop/tools/lib/hadoop-aws-3.2.0.jar:/opt/apache-hive-metastore-3.0.0-bin/lib/postgresql-42.7.4.jar;
        export HIVE_AUX_JARS_PATH=/opt/apache-hive-metastore-3.0.0-bin/lib/postgresql-42.7.4.jar;
        echo 'Waiting for database on hive-metastore-db:5432 ...';
        while ! nc -z hive-metastore-db 5432; do sleep 1; done;
        echo 'Database on hive-metastore-db:5432 started';
        if [ ! -f /opt/apache-hive-metastore-3.0.0-bin/lib/postgresql-42.7.4.jar ]; then
          curl -fsSL https://jdbc.postgresql.org/download/postgresql-42.7.4.jar -o /opt/apache-hive-metastore-3.0.0-bin/lib/postgresql-42.7.4.jar;
        fi;
        /opt/apache-hive-metastore-3.0.0-bin/bin/schematool -initSchema -dbType postgres;
        /opt/apache-hive-metastore-3.0.0-bin/bin/start-metastore
      "
    ports:
      - "9083:9083"
    volumes:
      - ./configs/metastore-site.xml:/opt/apache-hive-metastore-3.0.0-bin/conf/metastore-site.xml:ro
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9083 || exit 1" ]
      interval: 15s
      retries: 10
      start_period: 60s

  # ============================================================
  #  Spark Master – Batch Processing Engine (Iceberg + MinIO)
  # ============================================================
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://minio:9000
      # ---- Cấu hình cho spark job chạy từ spark-master (docker exec bởi Airflow) ----
      - LOAD_DOTENV=false          # image không có python-dotenv; dùng env bên dưới
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - HIVE_METASTORE_URI=thrift://hive-metastore:9083
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PG_HOST=postgres
      - PG_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080" # Spark Master Web UI
      - "7077:7077" # Spark Master RPC
    volumes:
      - ./spark_jobs:/opt/spark/jobs
      - ./feature_store:/opt/spark/feature_store
      - ./scripts:/opt/spark/scripts
      - ./configs/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./data/iceberg:/tmp/iceberg
    depends_on:
      minio-init:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_healthy

  # ============================================================
  #  Spark Worker
  # ============================================================
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=${SPARK_CORE}
      - SPARK_WORKER_MEMORY=${SPARK_MEMORY}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://minio:9000
    ports:
      - "8082:8081" # Spark Worker Web UI
    volumes:
      - ./spark_jobs:/opt/spark/jobs
      - ./configs/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./data/iceberg:/tmp/iceberg
    depends_on:
      - spark-master
      - minio-init
      - hive-metastore

  # ============================================================  
  #  Trino – Distributed SQL Query Engine (query Iceberg)
  # ============================================================
  trino:
    image: trinodb/trino:446
    container_name: trino
    ports:
      - "8084:8080"
    volumes:
      - ./configs/trino-catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties
      - trino_data:/data/trino
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_REGION=us-east-1
    depends_on:
      minio-init:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/v1/info" ]
      interval: 15s
      retries: 5

  # ============================================================
  #  ClickHouse – OLAP Data Warehouse (Serving Layer)
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./sql/clickhouse:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--query", "SELECT 1" ]
      interval: 10s
      retries: 5

  # ============================================================
  #  Apache Flink – Stream Processing Engine (Window Aggregation)
  # ============================================================
  flink-jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: flink-jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        rest.flamegraph.enabled: true
      # ---- Env cho PyFlink job (window_aggregation.py đọc os.getenv) ----
      - LOAD_DOTENV=false
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=pg.public.orders
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    ports:
      - "8081:8081"
    volumes:
      - ./:/opt/project
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      connect:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/overview" ]
      interval: 15s
      retries: 5

  flink-taskmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: flink-taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2048m
    volumes:
      - ./:/opt/project
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy

  # ============================================================
  #  Airflow – Pipeline Orchestration
  # ============================================================
  airflow-postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_DB: ${AIRFLOW_DB}
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB}" ]
      interval: 10s
      retries: 5

  airflow-init:
    image: apache/airflow:2.9.3-python3.11
    container_name: airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    entrypoint: /bin/bash -c "airflow db init && airflow users create --username ${AIRFLOW_ADMIN_USER} --firstname Admin --lastname User --role Admin --email admin@example.com --password ${AIRFLOW_ADMIN_PASSWORD}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags

  airflow-webserver:
    image: apache/airflow:2.9.3-python3.11
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./scripts:/opt/airflow/scripts
    command: webserver
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      retries: 5

  airflow-scheduler:
    # Image có thêm docker CLI để task (LocalExecutor) exec spark-submit vào spark-master
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./scripts:/opt/airflow/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "984"   # GID group 'docker' trên host -> airflow đọc được docker.sock
    command: scheduler

  # ============================================================
  #  Metabase – BI Dashboard
  # ============================================================
  metabase:
    image: metabase/metabase:v0.49.6
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - mbdata:/metabase-data
    depends_on:
      - clickhouse
      - trino

  # ============================================================
  #  Apache Superset – BI (Trino + ClickHouse)
  #  Metabase OSS không có driver Trino/ClickHouse nên dùng Superset.
  # ============================================================
  superset-init:
    image: second_project/superset:4.1.1
    container_name: superset-init
    build:
      context: .
      dockerfile: Dockerfile.superset
    depends_on:
      clickhouse:
        condition: service_healthy
      trino:
        condition: service_healthy
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-superset_dev_secret_123}
    volumes:
      - superset_home:/app/superset_home
    entrypoint: >
      /bin/sh -c "superset fab create-admin --username ${SUPERSET_ADMIN_USER:-admin} --firstname Admin --lastname User --email ${SUPERSET_ADMIN_USER:-admin}@example.com --password ${SUPERSET_ADMIN_PASSWORD:-admin} || true; superset db upgrade; superset init; echo 'Superset init completed'; exit 0;"

  superset:
    image: second_project/superset:4.1.1
    container_name: superset
    build:
      context: .
      dockerfile: Dockerfile.superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-superset_dev_secret_123}
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config.py
    volumes:
      - superset_home:/app/superset_home
      - ./configs/superset_config.py:/app/pythonpath/superset_config.py
    command: >
      /bin/sh -c "superset run -h 0.0.0.0 -p 8088 --with-threads"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8088/health" ]
      interval: 15s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  chdata:
  mbdata:
  superset_home:
  minio_data:
  trino_data:
  airflow_pgdata:
  hive_pgdata:

